# Revisión semanal del sitio publicado: links rotos (lychee) y rendimiento/SEO/accesibilidad (Lighthouse CI).
# Si algo falla, la corrida queda en rojo y GitHub avisa por mail. Lighthouse solo advierte (no falla).
name: Enlaces y rendimiento
on:
  schedule:
    - cron: '0 13 * * 1'   # lunes 10:00 hora Argentina
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enlaces:
    runs-on: ubuntu-latest
    steps:
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --timeout 20 --accept '200..=299,403,429' https://cg-estudio-asociados.vercel.app
          fail: true
  rendimiento:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npx --yes @lhci/cli@0.15.1 autorun
